name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      rollout_approved:
        description: Confirm this production action is explicitly authorized after migration and rollback review
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.rollout_approved == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
