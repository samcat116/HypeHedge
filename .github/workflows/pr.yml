name: PR Check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    name: Workerd tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx wrangler deploy --dry-run
